<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPARUS Portal - Unified Portal for Archaeogenetic Research in the South</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { background-color: #f8fafc; font-family: 'Inter', sans-serif; color: #334155; margin: 0; padding: 0; }
        .main-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* --- استایل هدر جدید با لوگوی شما --- */
        .portal-header { 
            background-color: #ffffff; /* پس‌زمینه سفید برای لوگو */
            padding: 15px 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
            display: flex; 
            align-items: center; /* تراز عمودی وسط */
        }
        
        /* استایل خود لوگو */
        .header-logo {
            height: 70px; /* ارتفاع لوگو را تنظیم کنید */
            width: auto; /* عرض به طور خودکار تنظیم می‌شود */
            margin-right: 25px; /* فاصله لوگو تا متن */
        }
        
        .header-text-container {
            display: flex;
            flex-direction: column;
        }

        .portal-title { 
            color: #1e293b; /* slate-800 */
            font-weight: 600; 
            margin: 0; 
            font-size: 1.75em; 
            letter-spacing: -0.5px;
        }
        
        .portal-subtitle { 
            color: #64748b; /* slate-500 */
            font-weight: 400; 
            margin: 0; 
            font-size: 1em; 
        }

        /* --- بخش نقشه (بدون تغییر) --- */
        .map-section { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); 
            margin-bottom: 25px; 
            height: 500px; /* ارتفاع پیش‌فرض برای نقشه */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            border: 2px dashed #e2e8f0;
        }

        /* --- بخش جدول (بدون تغییر) --- */
        #table-container { 
            /* این محتوا توسط اسکریپت پایتون شما پر می‌شود */
        }
    </style>
</head>
<body>

<div class="main-container">
    <header class="portal-header">
        <img src="https://github.com/MoeinGazestanii/UPARUS-Portal/blob/main/Logo.png?raw=true" alt="UPARUS Logo" class="header-logo">
        
        <div class="header-text-container">
            <h1 class="portal-title">UPARUS Portal</h1>
            <p class="portal-subtitle">Unified Portal for Archaeogenetic Research in the South</p>
        </div>
    </header>

    <section class="map-section">
        <div>
            <h4>🗺️ Interactive Map Container</h4>
            <p>Your interactive map visualization will be loaded here.</p>
        </div>
    </section>

    <section id="table-container">
        <div class="alert alert-info text-center">
            ⌛ Loading samples data table...
            <br>
            <small>(Please ensure you have generated 'samples_table.html' using the Python script and it is accessible here.)</small>
        </div>
    </section>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.js"></script>

<script>
    // اسکریپت برای بارگذاری فایل جدول (samples_table.html) داخل این صفحه
    $(document).ready(function() {
        // فرض بر این است که فایل ساخته شده توسط پایتون در همان پوشه قرار دارد
        $("#table-container").load("samples_table.html", function(response, status, xhr) {
            if (status == "error") {
                $(this).html('<div class="alert alert-danger text-center">❌ Error loading samples table.<br>Make sure "samples_table.html" exists in the same directory.</div>');
            }
        });
    });
</script>

</body>
</html>
